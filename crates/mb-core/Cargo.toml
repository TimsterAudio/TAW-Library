[package]
name = "mb-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
dirs = "6"
imagesize = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lookups (stage 2): only used while Lookups is switched on.
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
