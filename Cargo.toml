[workspace]
members = ["crates/mb-core"]

[workspace.package]
# The release version for the whole project.
version = "0.2.0"
edition = "2021"

[package]
name = "taw-library"
version.workspace = true
edition.workspace = true
description = "Timster's Audio Works Library (LB-001): a native music library manager for Windows and Linux"
authors = ["Timster's Audio Works"]
publish = false

[dependencies]
mb-core = { path = "crates/mb-core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
taw-panel = { git = "https://github.com/TimsterAudio/TAW-Panel", rev = "1b8162d75d10c41a8c9b021fc3d31e2a3311aeb6" } # 0.3.0
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
serde_json = "1"
