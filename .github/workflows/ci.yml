name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # TAW-Panel is a private repo: cargo fetches it with a read-only token
      # (repo secret TAW_PANEL_TOKEN). Not needed if TAW-Panel is public.
      - name: Access TAW-Panel
        shell: bash
        env:
          TOKEN: ${{ secrets.TAW_PANEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/TimsterAudio/TAW-Panel".insteadOf "https://github.com/TimsterAudio/TAW-Panel"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: music-box-linux-x86_64
          path: |
            target/release/music-box
            packaging/linux/music-box.desktop

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # TAW-Panel is a private repo: cargo fetches it with a read-only token
      # (repo secret TAW_PANEL_TOKEN). Not needed if TAW-Panel is public.
      - name: Access TAW-Panel
        shell: bash
        env:
          TOKEN: ${{ secrets.TAW_PANEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/TimsterAudio/TAW-Panel".insteadOf "https://github.com/TimsterAudio/TAW-Panel"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: music-box-windows-x86_64
          path: target/release/music-box.exe
